version: 2

updates:
  # Keeps the workflow's actions current. Minor and patch updates are grouped; a major gets its own
  # pull request, because the deploy job only runs on main and a pull request cannot exercise it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

  # Dependencies: minor and patch updates arrive together; majors get their own pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      minor-and-patch:
        update-types: [minor, patch]
