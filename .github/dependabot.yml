version: 2

updates:
  # Keeps the workflow's actions current. Minor and patch updates are grouped; a major gets its own
  # pull request, because the deploy job only runs on main and a pull request cannot exercise it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

  # Dependencies: minor and patch updates arrive together; majors get their own pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors that cannot install yet (npm ci stops on a peer conflict). Remove each entry once unblocked.
    ignore:
      # eslint-plugin-jsx-a11y only supports ESLint up to 9, and @eslint/js 10 belongs with ESLint 10.
      # Tracked in issue #9; eslint and @eslint/js must be upgraded together.
      - dependency-name: eslint
        versions: ['>=10']
      - dependency-name: '@eslint/js'
        versions: ['>=10']
      # typescript-eslint supports TypeScript below 6.1 only (6.0 is still allowed).
      - dependency-name: typescript
        versions: ['>=6.1.0']
